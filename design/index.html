<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Канва в деталях — Сессия 20</title>

<!--
  ПРОТОТИП, НЕ ПРОДУКТ.

  Открывается двойным щелчком: ни сервера, ни сборки, ни модулей —
  нарочно, чтобы посмотреть было нечем сломать. В `pnpm check` не входит,
  packages/ не трогает.

  Сессия 19 поставила КАРКАС: зоны, два набора токенов, сетку 8px.
  Сессия 20 наполняет КАНВУ: каталоги, свойства над объектом, выделение
  и выравнивание, тема сцены и палитры.

  Что здесь НАСТОЯЩЕЕ, а не нарисованное:

    · состав панели свойств СЧИТАЕТСЯ из `appliesTo`, а не набран руками.
      Поэтому над картинкой полей ровно два, и это видно, а не заявлено;

    · сирота цвета не изображена, а ВОСПРОИЗВЕДЕНА: элемент «Подпись»
      ссылается на несуществующую роль без запасного значения, и браузер
      честно отбрасывает объявление — текст чёрный на тёмном фоне.
      Ровно то, что измерил S11 и что автор увидел бы у себя;

    · смена палитры — записи на ОДНОМ узле, элементы не обходятся;

    · выравнивание работает: по сцене для одного, друг по другу для двух.

  Разметка ниже — только зоны. Всё, у чего есть модель, рисуется из данных
  в main.js: элементы сцены, панель свойств, каталоги, палитры, сироты.
  Это не экономия, а требование §16: макет без названной сущности под ним —
  обещание, которое нечем исполнить.

  Разбор — docs/strategy.md. Система — docs/design/system.md.
-->

<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="montage.css">

<body>
<div class="shell">

  <!-- ================= ВЕРХНЯЯ ПОЛОСА ================= -->
  <header class="topbar">
    <span class="topbar__name">Производная — зачем она нужна</span>

    <!-- Два вида на одни данные (product.md §13). Карта — ОТДЕЛЬНЫЙ режим
         на весь экран, а не панель: решение владельца 05.08.2026. Развилка
         начинается на линии и обязана закончиться на карте, потому что
         завести ветку на линии физически нечем. -->
    <div class="viewswitch" role="group" aria-label="Вид">
      <button type="button" data-view="line" aria-pressed="true">Линия</button>
      <button type="button" data-view="map" aria-pressed="false">Карта</button>
    </div>

    <span class="topbar__spacer"></span>

    <!-- Один счётчик на все сироты: метки и ЦВЕТА. Одна болезнь — один
         знак и одно место, иначе автор научится не смотреть ни туда,
         ни туда. Число считается, а не написано. -->
    <button type="button" class="checkcount" id="checkcount" hidden>
      <span class="checkcount__dot"></span><span id="checkcount-text"></span>
    </button>

    <button type="button" class="button-block" style="width:auto">Предпросмотр</button>
    <button type="button" class="button-block button-block--primary" style="width:auto">Отдать</button>
  </header>

  <!-- ================= РЕЛЬС КАТАЛОГОВ =================
       Приём Canva: узкий рельс выбирает, что показывает широкая панель.
       Каталогов может стать сколько угодно без переверстки. -->
  <nav class="rail" aria-label="Каталоги" id="rail">
    <button type="button" class="rail__item" data-panel="templates" aria-pressed="true">
      <span class="rail__glyph">▦</span>Шаблоны</button>
    <button type="button" class="rail__item" data-panel="shapes">
      <span class="rail__glyph">◇</span>Фигуры</button>
    <button type="button" class="rail__item" data-panel="text">
      <span class="rail__glyph">T</span>Текст</button>
    <button type="button" class="rail__item" data-panel="theme">
      <span class="rail__glyph">◐</span>Тема</button>
    <button type="button" class="rail__item" data-panel="own">
      <span class="rail__glyph">↑</span>Своё</button>
    <!-- «Части» с рельса УБРАНЫ. Части — это карта, а карта теперь
         отдельный режим в верхней полосе. Две двери в одно место — та же
         ошибка, из-за которой в Сессии 20 счётчик сирот сделан один
         на две болезни: автор перестаёт смотреть в обе. -->
  </nav>

  <!-- ================= ПАНЕЛЬ КАТАЛОГА =================
       Голова и тело рисуются из данных: у каждой панели свои заголовок,
       пояснение и состав. Седьмая панель — «Объект»: её открывает кнопка
       «Ещё» с панели свойств, и на рельсе её нет, потому что без
       выделения она бессмысленна. -->
  <aside class="catalog">
    <div class="catalog__head">
      <h2 class="catalog__title" id="catalog-title"></h2>
      <p class="catalog__hint" id="catalog-hint"></p>
    </div>
    <div class="catalog__body" id="catalog-body"></div>
  </aside>

  <!-- ================= ХОЛСТ ================= -->
  <main class="stage-area">

    <!-- КОНТЕКСТНАЯ ПОЛОСА СВОЙСТВ. Снято с натуры у Canva 05.08.2026:
         у них это НЕПОДВИЖНАЯ полоса над холстом, а не панель, плавающая
         над объектом (как ошибочно записал strategy.md §4). Появляется
         только при выделении и меняет состав под тип.

         Высота зарезервирована ВСЕГДА, даже когда полоса пуста. Это не
         перестраховка: в Сессии 18 появляющаяся зона отняла у сцены 44px,
         масштаб упал с 0.2083 до 0.2028 и уронил e2e про ресайз. Проверено,
         что Canva делает так же: верх страницы стоит на одной координате
         и с выделением, и без него. -->
    <div class="propbar" id="propbar"></div>

    <div class="stage-fit">
      <!-- Сцена 1920x1080, как в продукте (ADR-007). Здесь она вписана
           пропорцией, а координаты элементов заданы в тех же пикселях
           и переводятся в проценты — чтобы числа в данных значили то же,
           что значат в схеме, а не «столько-то от макета». -->
      <div class="scene" id="scene">
        <div class="scene__els" id="scene-els"></div>
        <div class="scene__overlay" id="scene-overlay"></div>

        <!-- ГЕЙТ В РЕДАКТОРЕ. Состояние, у которого механики нет ВОВСЕ:
             player/src/preview.ts прокидывает `gates` (строки 54 и 81),
             но `prompt` и `options` не рисует нигде. Значит автор физически
             не может увидеть свою остановку такой, какой её увидит зритель,
             ни в одном месте редактора.

             Отдельным узлом, а не внутри scene-overlay: main.js чистит
             #scene-els и #scene-overlay на каждой отрисовке, и слой,
             положенный туда, исчезал бы при любом щелчке по сцене. -->
        <div class="gatelayer" id="gate-layer" hidden></div>
      </div>

      <p class="note" id="note"></p>
    </div>
  </main>

  <!-- ================= ДОРОЖКА (ориентир CapCut, снят с натуры) =========
       Пять полос: линейка · звук · слайды · остановки · расшифровка.
       У каждой ГОЛОВА СЛЕВА со своим именем — там же называется причина,
       когда полоса пуста («No tracks» у CapCut, а не просто серое поле).

       Слайды и остановки разъехались по РАЗНЫМ полосам, хотя в продукте
       сегодня лежат в одной (MarksLane берёт marks с kind). Слайдов много,
       остановок единицы, и в общей полосе остановка теряется среди ромбов —
       а на ней стоит весь интерактив. MarkKind их уже различает, значит
       это перестановка вида, а не модели.

       Содержимое рисуется из данных в montage.js: разметка здесь — зоны. -->
  <section class="track" aria-label="Дорожка">
    <div class="mt-bar" id="track-bar"></div>
    <div class="mt-lanes" id="track-lanes"></div>
    <!-- Свой класс, а не `.note` от сцены: у того min-height 84px и вид
         карточки — он для пояснения ПОД СЦЕНОЙ. Взятый сюда, он съедал
         треть дорожки и всплывал поверх полос. Высота всё равно постоянна,
         и по той же причине: пояснение меняется по состоянию, а дорожка
         от этого ездить не должна. -->
    <p class="mont-note" id="mont-note"></p>
  </section>

</div>

<!-- ПАНЕЛЬ МОНТАЖА — ОВЕРЛЕЙ СПРАВА, а не колонка, и это право куплено
     замером. У CapCut панель свойств выезжает поверх холста: контейнер
     сцены `canvas-cover` дал x 651.73, y 132, w 931.55, h 524 и с выделением,
     и без него — совпало до сотых. Значит ширину она не отнимает, масштаб
     сцены не падает, и довод Сессии 18 (появившаяся зона уронила масштаб
     и e2e) к оверлею не относится. Глазами колонка и оверлей неотличимы. -->
<aside class="mont-panel" id="mont-panel" hidden></aside>

<!-- ================= КАРТА — ОТДЕЛЬНЫЙ РЕЖИМ =================
     Не панель и не вкладка каталога. Решение владельца 05.08.2026: развилка
     начинается на линии, а закончиться обязана на карте, потому что завести
     ветку на линии физически нечем.

     Отсюда же снимается вопрос product.md §13 «карта должна быть полезной
     на одном узле»: на карту попадают ИЗ развилки, а разрез уже породил
     ветки. Состояние «карта из одного узла» недостижимо. -->
<div class="mapmode" id="mapmode" hidden>
  <div class="map__board" id="map-board"></div>
  <aside class="map__side" id="map-side"></aside>
</div>

<script src="main.js"></script>
<script src="montage.js"></script>
</body>
</html>
