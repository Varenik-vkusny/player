<!doctype html>
<meta charset="utf-8">
<title>Спайк: стек редактора на нашей сцене</title>
<style>
  :root { --ruler: 24px; }
  body { margin: 0; font: 13px/1.45 system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  #root { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  .left { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  h3 { margin: 0; font-size: 14px; }

  /* Линейки @scena/react-guides обрамляют область сцены сверху и слева. */
  .frame { display: grid; grid-template-columns: var(--ruler) 1fr; grid-template-rows: var(--ruler) 1fr;
           flex: 1; min-height: 0; background: #d4d4d8; }
  .corner { background: #27272a; }
  .ruler-h, .ruler-v { position: relative; overflow: hidden; }
  .viewport { position: relative; overflow: hidden; background: #d4d4d8; }

  /* Хост сцены. renderScene сам выставляет размер 1920x1080 и фон. */
  .stage-host { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

  .panel { background: #fff; border-left: 1px solid #d4d4d8; padding: 12px; overflow: auto; }
  pre { font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; margin: 4px 0 12px; }
  button { font: inherit; padding: 4px 8px; margin: 0 4px 4px 0; }
  .hint { color: #52525b; }
</style>
<div id="root"></div>
<script type="module" src="./main.jsx"></script>
