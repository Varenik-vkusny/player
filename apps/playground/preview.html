<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Предпросмотр сцены — оснастка скриншотных тестов</title>
<!--
  Подмена шрифтов подключается из скрипта по `?fonts=test`, а не отсюда.

  Она нужна там, где эталон ХРАНИТСЯ: набор шрифтов Windows против набора
  Ubuntu делает такие эталоны недетерминированными по причине, не имеющей
  отношения к коду (ADR-006). Но в тесте паритета эталон не хранится —
  сравниваются два живых снимка, и один из них снят с настоящего редактора,
  где никакой подмены нет. Включи подмену безусловно — и паритет сравнивал
  бы разные шрифты, то есть не проверял бы ничего.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #07090c; overflow: hidden; }
  /* Контейнер занимает вьюпорт целиком: снимок делается по нему, поэтому его
     размер обязан зависеть только от вьюпорта, а не от содержимого.

     background-color здесь не косметика, а часть инварианта №5. Без своего
     фона узел прозрачен, и цвет под текстом «приходит» издалека — от body.
     Для большинства кадров это неотличимо, но Chromium иначе решает, каким
     сглаживанием рисовать текст: с явным непрозрачным фоном ПРЯМО на этом
     узле — субпиксельным (цветная кайма), без него, полагаясь на просвечивание
     через transform-слой сцены, — чёрно-белым. Редактор (.ed-stage-host,
     packages/editor/src/styles.ts) от той же причины не страдает — там до
     непрозрачного .ed-root ближе, — поэтому расхождение и не было симметричным.
     Проверено на живых страницах (не догадкой): при одном и том же тексте,
     шрифте и цвете редактор и этот хост расходились на 524 из 360 800
     пикселей — разница лежала ровно на сглаженных краях букв. С этой
     строкой — 0.
     Цвет — тот же #07090c, что у body и у всех остальных оболочек продукта,
     так что видимых пикселей эта строка не меняет нигде, кроме как убирает
     зависимость режима сглаживания от хоста.

     СВЯЗЬ В ОБЕ СТОРОНЫ (06.08.2026, Сессия 25): значение цвета обязано
     совпадать с --ui-surface-canvas у .ed-stage-host в
     packages/editor/src/styles.ts. Проверено переводом хрома редактора
     на светлые значения: у редактора узел остался без своего фона,
     унаследовал белый, и паритет упал с 0 до 0.2825 % при пороге 0.1.
     Менять цвет здесь можно только вместе с той ролью И с перезаписью
     скриншотных эталонов — они снимаются с этого узла вместе
     с летербоксом. */
  #stage-host { position: fixed; inset: 0; overflow: hidden; background-color: #07090c; }
</style>
</head>
<body>
<div id="stage-host"></div>
<script type="module" src="/src/preview.ts"></script>
</body>
</html>
