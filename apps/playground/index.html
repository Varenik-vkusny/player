<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Пустая иконка: иначе браузер сам просит /favicon.ico и роняет в консоль
     404, который потом маскирует настоящие ошибки загрузки. -->
<link rel="icon" href="data:,">
<title>Playground — плеер</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07090c; color: #e6edf5;
               font: 15px/1.5 system-ui, sans-serif; }
  #app { display: grid; grid-template-rows: 1fr auto; height: 100%; }

  #stage-host { position: relative; overflow: hidden; }

  /* z-index обязателен: плеер добавляет сцену в контейнер ПОСЛЕ оверлея,
     поэтому по порядку в документе она рисуется поверх. В гейте сцена
     становится кликабельной и без этого перехватывает нажатия по ответам. */
  #overlay { position: absolute; inset: 0; z-index: 10; display: none; place-items: center;
             background: rgba(7, 9, 12, .72); backdrop-filter: blur(2px); }
  #overlay[data-open="1"] { display: grid; }
  .panel { background: #131820; border: 1px solid #2c3a4d; border-radius: 18px;
           padding: 28px 32px; max-width: 620px; width: min(90vw, 620px); }
  .panel h2 { margin: 0 0 18px; font-size: 22px; font-weight: 600; }
  .options { display: grid; gap: 10px; }
  button { font: inherit; padding: 12px 16px; border-radius: 12px; cursor: pointer;
           border: 1px solid #2c3a4d; background: #1b2430; color: inherit; text-align: left; }
  button:hover { border-color: #4a5f7d; }
  button.primary { background: #e4572e; border-color: #e4572e; text-align: center; }
  input { font: inherit; padding: 12px 16px; border-radius: 12px; width: 100%;
          border: 1px solid #2c3a4d; background: #0d1218; color: inherit; box-sizing: border-box; }
  .feedback { margin-top: 14px; min-height: 1.5em; font-size: 14px; }
  .feedback.wrong { color: #ff8a6b; }
  .feedback.right { color: #a8c686; }

  #bar { display: flex; align-items: center; gap: 14px; padding: 12px 18px;
         border-top: 1px solid #1c242f; background: #0b0f14; }
  #bar code { font-variant-numeric: tabular-nums; }
  #track { flex: 1; height: 6px; background: #1c242f; border-radius: 3px; position: relative; }
  #played { position: absolute; inset: 0 auto 0 0; width: 0; background: #e4572e; border-radius: 3px; }
  .gate-mark { position: absolute; top: -4px; width: 3px; height: 14px;
               background: #a8c686; border-radius: 2px; }
  #state { color: #7d8fa5; min-width: 7em; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-host">
    <div id="overlay"><div class="panel" id="panel"></div></div>
  </div>
  <div id="bar">
    <button id="play" class="primary" disabled>Загрузка…</button>
    <div id="track"><div id="played"></div></div>
    <code id="clock">0.00</code>
    <span id="state">idle</span>
    <span id="progress"></span>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
