<style>
  :root{color-scheme:dark}

  .strip{position:relative;display:flex;align-items:flex-end;gap:6px;height:250px;
    padding:10px 12px 12px;background:#0b0e13;border:1px solid #262d36;

  .cell{position:relative;flex:0 0 auto;border-radius:5px;border:1px solid #39414c;
    background:#11141a;overflow:hidden;cursor:pointer;
    transition:width .16s cubic-bezier(.2,.8,.2,1),height .16s cubic-bezier(.2,.8,.2,1),

  .cell .scene{position:absolute;top:0;left:0;transform-origin:0 0}
  .cell .scene>div{position:absolute}
  .cell.dim .scene>div{filter:grayscale(1);opacity:.16}
  .cell.dim .scene>div.hot{filter:none;opacity:1;outline:2px solid #e4572e;outline-offset:1px}

  .cell.picked{border-color:#7ee2a8;box-shadow:0 0 0 1px #7ee2a866,0 8px 26px #000a;z-index:6}

  .phrase b{color:#e6edf3;font-style:normal;font-weight:600;margin-right:8px}

  /* ДОРОЖКА СНИЗУ — управление */
  .lane{position:relative;height:86px;background:#0b0e13;border:1px solid #262d36;
    border-top:0;border-radius:0 0 9px 9px;cursor:ew-resize;overflow:hidden}
  .lane i{position:absolute;bottom:50%;width:2px;background:#2f6f9f;transform:translateY(50%);

  .mark.on{color:#fff;transform:scale(1.35)}
  .mark-gate{color:#e4572e}
  .tail{position:absolute;height:3px;background:#6ea8fe;opacity:.4;border-radius:2px}
  .head{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:9;pointer-events:none}

<h1>§14.11 — лента слайдов с лупой, управление дорожкой</h1>
<p class="sub">
  Лента сверху идёт ровным рядом и про время не знает. Ведите курсор
  по дорожке внизу — ряд раздувается лупой под тем слайдом, к чьему ромбу
  вы подошли. Нажмите на карточку — головка прыгнет на её ромб; нажмите
  на ромб — фокус уедет на её карточку.
</p>

<div class="bar">
  <div><label for="mode">Управление</label>
    <select id="mode">
      <option value="track">вариант 1 — веду по дорожке</option>
      <option value="both">вариант 2 — и лентой, и дорожкой</option>
    </select></div>
  <div><label for="set">Набор</label>
    <select id="set">
      <option value="demo">demo.json — 15 слайдов</option>
      <option value="dense">плотный — 40 слайдов</option>
    </select></div>
  <div><label for="pic">Картинка</label>
    <select id="pic">
      <option value="diff">разница с предыдущим</option>
      <option value="full">полная сцена</option>
    </select></div>
  <button class="ui" id="play">▶ проиграть</button>
  <div id="stats" class="num"></div>
</div>

<div class="phrase" id="phrase"></div>
<div class="strip" id="strip"></div>
<div class="lane" id="lane"></div>

и никакого"},{"id":"node-1-slide-15","t":40.563,"states":{"bg":{"x":0,"y":0,"width":1920,"height":1080,"rotation":0,"zIndex":0,"opacity":1,"visible":true,"style":{"background":"#11141a"}},"title":{"x":140,"y":130,"width":1300,"height":180,"rotation":0,"zIndex":3,"opacity":1,"visible":true,"style":{"color":"#f5f7fa","font-family":"Georgia, serif","font-size":"68px","line-height":"1.15","font-weight":"700"}},"accent":{"x":140,"y":350,"width":220,"height":12,"rotation":0,"zIndex":2,"opacity":1,"visible":true,"style":{"background":"#e4572e","border-radius":"6px"}},"lead":{"x":140,"y":420,"width":1000,"height":260,"rotation":0,"zIndex":3,"opacity":1,"visible":true,"style":{"color":"#9fb0c4","font-family":"system-ui, sans-serif","font-size":"36px","line-height":"1.5"}},"card":{"x":1240,"y":400,"width":520,"height":340,"rotation":0,"zIndex":1,"opacity":1,"visible":true,"style":{"background":"#1b2430","border-radius":"28px","border":"2px solid #2c3a4d"}},"dot":{"x":1420,"y":440,"width":160,"height":160,"rotation":0,"zIndex":2,"opacity":1,"visible":true,"style":{"background":"#f3a712","border-radius":"50%"}},"footer":{"x":140,"y":900,"width":1200,"height":80,"rotation":0,"zIndex":3,"opacity":1,"visible":true,"style":{"color":"#6d7f95","font-family":"system-ui, sans-serif","font-size":"28px"}}},"changed":[{"id":"footer","how":"появляется"}],"first":false,"phrase":"прервалось Никакой перемотки никакого повторения"}],"gates":[{"t":14.387},{"t":44.187999999999995}]};
const MORPH = 0.6;

// Лупа: размер карточки падает от фокуса по РЯДУ, а не по времени.
const BASE_H = 64;     // в покое
const PEAK_H = 210;    // под фокусом
const SPREAD = 2.6;    // на сколько соседей растекается лупа
const AR = DATA.stageW / DATA.stageH;

const el=(t,c,s)=>{const n=document.createElement(t);if(c)n.className=c;if(s)Object.assign(n.style,s);return n};
const lane=document.getElementById('lane');
const strip=document.getElementById('strip');
const phraseBox=document.getElementById('phrase');

let slides=[], picked=0, focusFrac=0, playing=null;

function sceneInto(cell,sl,w,h,pic){
  const k=w/DATA.stageW;
  const scene=el('div','scene',{width:DATA.stageW+'px',height:DATA.stageH+'px',transform:'scale('+k+')'});
  const hot=new Set((sl.changed||[]).map(c=>c.id));
  for(const id of Object.keys(sl.states).sort((a,b)=>(sl.states[a].zIndex??0)-(sl.states[b].zIndex??0))){
    const st=sl.states[id];
    if(st.visible===false && !(pic==='diff'&&hot.has(id))) continue;
    const d=el('div',pic==='diff'&&hot.has(id)?'hot':null,{left:st.x+'px',top:st.y+'px',
      width:st.width+'px',height:st.height+'px',opacity:String(st.opacity??1),overflow:'hidden'});
    Object.assign(d.style,st.style||{});
    if(DATA.content[id]) d.textContent=DATA.content[id];
    scene.appendChild(d);
  }
  cell.appendChild(scene);
}

function buildStrip(){
  const pic=document.getElementById('pic').value;
  strip.querySelectorAll('.cell').forEach(n=>n.remove());
  slides.forEach((sl,i)=>{
    const cell=el('div','cell'+(pic==='diff'?' dim':''));
    cell.dataset.i=String(i);
    sceneInto(cell,sl,PEAK_H*AR,PEAK_H,pic);
    const sec=el('div','sec');sec.textContent=sl.t.toFixed(1);cell.appendChild(sec);
    const ch=sl.changed||[];
    if(pic==='diff'){
      if(!ch.length&&!sl.first){const n=el('div','nochange');n.textContent='ничего не меняет';cell.appendChild(n)}
      else{const c=el('div','cap');c.textContent=sl.first?'первый кадр':ch.map(x=>x.how+' '+x.id).join(', ');cell.appendChild(c)}
    }
    // Нажал на карточку — головка прыгнула на её ромб. Ждать, пока карточка
    // дорастёт, не нужно: увидел — нажал.
    cell.addEventListener('click',()=>{ picked=i; focusFrac=i; syncHead(sl.t); layout(); });
    strip.appendChild(cell);
  });
}

function layout(){
  const pic=document.getElementById('pic').value;
  const cells=[...strip.querySelectorAll('.cell')];
  cells.forEach((cell,i)=>{
    const d=Math.abs(i-focusFrac);
    const bump=Math.max(0,1-d/SPREAD);
    const h=BASE_H+(PEAK_H-BASE_H)*bump*bump;
    const w=h*AR;
    cell.style.height=h+'px';
    cell.style.width=w+'px';
    cell.style.opacity=String(0.45+0.55*bump);
    const scene=cell.querySelector('.scene');
    if(scene) scene.style.transform='scale('+(w/DATA.stageW)+')';
    const cap=cell.querySelector('.cap');
    if(cap) cap.style.fontSize=Math.max(8,Math.min(12,h/16))+'px';
    const sec=cell.querySelector('.sec');
    if(sec) sec.style.fontSize=Math.max(8,Math.min(12,h/16))+'px';
    const nc=cell.querySelector('.nochange');
    if(nc) nc.style.fontSize=Math.max(8,Math.min(12,h/16))+'px';
    cell.classList.toggle('focus',Math.round(focusFrac)===i);
    cell.classList.toggle('picked',picked===i);
  });
  const sl=slides[Math.round(focusFrac)];
  phraseBox.textContent='';
  if(sl){
    const b=document.createElement('b');
    b.textContent=sl.t.toFixed(2)+' с';
    phraseBox.appendChild(b);
    phraseBox.appendChild(document.createTextNode(
      sl.phrase ? '…'+sl.phrase+'…'
        : (sl.first?'первый кадр':(sl.changed.length?sl.changed.map(c=>c.how+' '+c.id).join(', '):'ничего не меняет'))));
  }

  // держим фокус в поле зрения
  const f=cells[Math.round(focusFrac)];
  if(f){
    const need=f.offsetLeft+f.offsetWidth/2-strip.clientWidth/2;
    strip.scrollLeft=need;
  }
  lane.querySelectorAll('.mark:not(.mark-gate)').forEach((m,i)=>
    m.classList.toggle('on',Math.round(focusFrac)===i));

  const shown=cells.filter(c=>parseFloat(c.style.height)>=110).length;
  const fh=parseFloat(cells[Math.round(focusFrac)]?.style.height||'0');
  document.getElementById('stats').textContent =
    'карточка под фокусом '+Math.round(fh*AR)+'×'+Math.round(fh)+' px · '
    + 'читаемых одновременно '+shown+' из '+slides.length;
}

// Проекция секунды на ДРОБНЫЙ номер в ряду: между соседними метками фокус
// едет плавно, поэтому лупа скользит, а не прыгает.
function fracAt(t){
  if(t<=slides[0].t) return 0;
  if(t>=slides[slides.length-1].t) return slides.length-1;
  for(let i=0;i<slides.length-1;i++){
    if(t>=slides[i].t && t<=slides[i+1].t){
      const span=slides[i+1].t-slides[i].t;
      return i+(span>0?(t-slides[i].t)/span:0);
    }
  }
  return 0;
}

let headEl=null;
function syncHead(t){
  if(!headEl) return;
  headEl.style.left=((t/DATA.duration)*lane.clientWidth)+'px';
}

function buildLane(){
  lane.textContent='';
  const W=lane.clientWidth, H=86;
  for(let x=0;x<W;x+=3){
    const a=Math.abs(Math.sin(x/17)*Math.sin(x/43)*Math.sin(x/7));
    lane.appendChild(el('i',null,{left:x+'px',height:(3+a*(H-14)).toFixed(1)+'px'}));
  }
  const px=t=>(t/DATA.duration)*W;
  slides.forEach((sl,i)=>{
    lane.appendChild(el('div','tail',{left:px(Math.max(0,sl.t-MORPH))+'px',
      width:(px(sl.t)-px(Math.max(0,sl.t-MORPH)))+'px',top:(H-18)+'px'}));
    const b=el('button','mark',{left:px(sl.t)+'px',top:(H-38)+'px'});
    b.textContent='◆';
    // Нажал на ромб — фокус уехал на его карточку.
    b.addEventListener('click',(e)=>{e.stopPropagation();picked=i;focusFrac=i;syncHead(sl.t);layout()});
    lane.appendChild(b);
  });
  for(const g of DATA.gates){
    const b=el('button','mark mark-gate',{left:px(g.t)+'px',top:'4px'});
    b.textContent='▮';lane.appendChild(b);
  }
  headEl=el('div','head',{left:'0px'});
  lane.appendChild(headEl);
}

lane.addEventListener('pointermove',(e)=>{
  if(document.getElementById('mode').value==='both' && e.buttons===0) return;
  const r=lane.getBoundingClientRect();
  const t=Math.max(0,Math.min(DATA.duration,((e.clientX-r.left)/r.width)*DATA.duration));
  focusFrac=fracAt(t);
  syncHead(t);
  layout();
});

document.getElementById('play').addEventListener('click',()=>{
  if(playing){clearInterval(playing);playing=null;document.getElementById('play').textContent='▶ проиграть';return}
  document.getElementById('play').textContent='⏸ пауза';
  let t=0;
  playing=setInterval(()=>{
    t+=0.08;
    if(t>DATA.duration){clearInterval(playing);playing=null;document.getElementById('play').textContent='▶ проиграть';return}
    focusFrac=fracAt(t);syncHead(t);layout();
  },40);
});

function honest(){
  const rows=[
    ['читаемость',
     'Карточка под фокусом <span class="ok">'+Math.round(PEAK_H*AR)+'×'+PEAK_H+' px</span> против 96×54 у всех прежних видов. '
     +'Заголовок 68 px превращается в '+(68*PEAK_H*AR/DATA.stageW).toFixed(1)+' px — <span class="ok">читается</span>. '
     +'Это стало возможно ровно потому, что крупная одновременно одна карточка, а не пятнадцать.'],
    ['скопления',
     '<span class="ok">Перестали существовать.</span> Ряд ровный, и метки в 0.1 с друг от друга — просто соседи. '
     +'Ни схлопывания, ни выносных линий, ни стопок.'],
    ['врёт ли про время',
     '<span class="ok">Лента про время не говорит вовсе</span> — говорит дорожка. Положение карточки в ряду это порядок, а не секунда.'],
    ['хвост окна движения',
     '<span class="ok">Не задет.</span> Дорожка не поменялась ни на пиксель: те же ромбы, тот же хвост, те же гейты.'],
    ['связь в обе стороны',
     'Нажатие по карточке ведёт головку, нажатие по ромбу ведёт ленту. <span class="ok">Половина уже сделана в Сессии 12</span> — головка и выбранный слайд ведут друг друга.'],
    ['где ломается',
     '<span class="bad">Лента прокручивается сама.</span> Пока фокус едет, ряд ползёт под курсором — если автор целится в карточку, а она уезжает, это раздражает. '
     +'Лечится тем, что прокрутка идёт только при управлении дорожкой, а при наведении на саму ленту замирает. Проверять руками.'],
    ['цена отрисовки',
     'Пятнадцать сцен в документе постоянно — измерено в Сессии 13: при CPU 4× это <span class="ok">59.9 fps</span>, то есть бесплатно.'],
  ];
  const t=document.getElementById('honest');t.textContent='';
  for(const [k,v] of rows){
    const tr=el('tr');const a=el('td');a.textContent=k;const b=el('td');b.innerHTML=v;
    tr.append(a,b);t.appendChild(tr);
  }
}

function rebuild(){
  const dense=document.getElementById('set').value==='dense';
  slides = dense
    ? Array.from({length:40},(_,i)=>{
        const src=DATA.slides[i%DATA.slides.length];
        return {...src,t:Math.min(DATA.duration-0.05,(i/40)*DATA.duration+(((i*7919)%100)/100-0.5)*0.9)};
      }).sort((a,b)=>a.t-b.t)
    : DATA.slides;
  picked=0;focusFrac=0;
  buildStrip();buildLane();layout();honest();
}
for(const id of ['set','pic','mode']) document.getElementById(id).addEventListener('change',rebuild);
addEventListener('resize',()=>{buildLane();layout()});
rebuild();
</script>
